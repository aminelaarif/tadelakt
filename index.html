<!doctype html>
<!-- SEO: lang tells search engines (and screen readers) which language the page is in -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SEO: required for mobile-friendliness (Google indexes the mobile version of your site) -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#a4472a" />
    <!-- SEO: per-page title, meta description, canonical, Open Graph and JSON-LD get injected here at build time -->
    <!--app-head-->
  </head>
  <body>
    <!-- SEO: the fully rendered page HTML gets injected here at build time, so crawlers see real content -->
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
